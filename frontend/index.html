<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Viewport responsive: el juego debe adaptarse de 320px a 1920px sin scroll horizontal (Requisito 1.6) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Cloudborn Legends</title>
    <link rel="icon" href="data:,">

    <style>
      /* Reset basico: sin margenes ni scroll horizontal en ningun ancho (Requisito 1.6) */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background: #0b1020;
        color: #e8eefc;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      /* Contenedor del juego: centra el canvas de Phaser y sirve de ancla
         para los elementos HTML superpuestos (overlay). */
      #contenedor-juego {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* El canvas que Phaser inyecta se escala de forma responsive. */
      #contenedor-juego canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }

      /* -----------------------------------------------------------------
         Overlay HTML de la pantalla de invocacion.
         El campo de texto, el boton y el contador NO son objetos de Phaser:
         son elementos HTML superpuestos sobre el canvas con position:absolute
         y un z-index superior al canvas para que queden por encima y sean
         accesibles (diseno de la UI del Frontend).
         InvocacionScene (tarea 8.2) muestra y oculta este overlay.
         ----------------------------------------------------------------- */
      #overlay-invocacion {
        position: absolute;
        z-index: 10; /* por encima del canvas de Phaser */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(90%, 520px);
        display: none; /* oculto por defecto; InvocacionScene lo muestra */
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }
      /* Clase que InvocacionScene usa para mostrar el overlay. */
      #overlay-invocacion.visible {
        display: flex;
      }

      /* Contenedor del formulario de invocacion: conserva la columna con
         separacion entre textarea, contador, boton y mensaje. */
      #formulario-invocacion {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      /* La escena oculta el formulario mientras muestra la tarjeta. */
      #formulario-invocacion.oculto {
        display: none;
      }

      #titulo-invocacion {
        margin: 0;
        /* Tamano fluido para que "Invoca tu leyenda" se vea completo y sin
           recortes en cualquier ancho (Requisito 1.4). */
        font-size: clamp(22px, 6vw, 40px);
        text-align: center;
        line-height: 1.2;
        word-break: break-word;
      }

      #descripcion-campeon {
        width: 100%;
        min-height: 120px;
        resize: vertical;
        padding: 12px;
        font-size: 16px; /* minimo 16px en movil (Requisito 18.1) */
        border-radius: 8px;
        border: 2px solid #3a4a7a;
        background: #141a33;
        color: #e8eefc;
      }

      /* Contador de caracteres en formato "X / 500" (Requisito 2.1). */
      #contador-caracteres {
        align-self: flex-end;
        font-size: 14px;
        color: #9fb0d8;
      }

      /* Boton de invocar: area tactil minima de 44x44px en movil (Requisito 18.2). */
      #boton-invocar {
        min-height: 44px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: #4f6bff;
        color: #ffffff;
        cursor: pointer;
      }
      #boton-invocar:hover {
        background: #3a56ee;
      }
      #boton-invocar:disabled {
        background: #2a335a;
        cursor: not-allowed;
      }

      /* Boton secundario para ir a la arena con campeones existentes.
         Reutiliza el mismo estilo que el boton secundario "Crear otro campeón"
         de la tarjeta (fondo #2a335a con borde #4f6bff) y conserva el area
         tactil minima de 44px del boton principal. */
      #boton-ir-arena-existentes {
        min-height: 44px;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        background: #2a335a;
        color: #e8eefc;
        border: 1px solid #4f6bff;
        cursor: pointer;
      }
      #boton-ir-arena-existentes:hover {
        background: #333e6e;
      }

      /* Mensajes de estado (carga / error) en espanol (Requisitos 2.2, 2.4, 2.5). */
      #mensaje-invocacion {
        min-height: 20px;
        font-size: 14px;
        text-align: center;
      }
      #mensaje-invocacion.error {
        color: #ff7a7a;
      }

      /* -----------------------------------------------------------------
         Tarjeta del campeon recien creado (preview).
         Tras un POST /campeones exitoso, InvocacionScene oculta el formulario
         y muestra esta tarjeta con el nombre, las cuatro estadisticas con
         barras de progreso, las habilidades como etiquetas y un circulo con
         los dos colores del campeon. Mantiene el mismo estilo visual del
         overlay (paleta #0b1020 / #141a33 / #4f6bff y tipografia del body).
         ----------------------------------------------------------------- */
      #tarjeta-campeon {
        display: none; /* oculta hasta que haya un campeon que mostrar */
        flex-direction: column;
        gap: 16px;
        padding: 20px;
        border-radius: 12px;
        background: #141a33;
        border: 2px solid #3a4a7a;
      }
      #tarjeta-campeon.visible {
        display: flex;
      }

      /* Cabecera: nombre grande a la izquierda y circulo de colores a la derecha. */
      .tarjeta-cabecera {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      #tarjeta-nombre {
        margin: 0;
        font-size: clamp(22px, 5vw, 34px);
        line-height: 1.2;
        word-break: break-word;
      }

      /* Circulo dividido en dos mitades con el color principal y el secundario. */
      #tarjeta-colores {
        flex: 0 0 auto;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 2px solid #0b1020;
        box-shadow: 0 0 0 1px #3a4a7a;
      }

      /* Bloque de las cuatro estadisticas con barras de progreso. */
      #tarjeta-estadisticas {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .estadistica {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .estadistica-cabecera {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        color: #9fb0d8;
      }
      .estadistica-valor {
        color: #e8eefc;
        font-variant-numeric: tabular-nums;
      }
      /* Riel de la barra de progreso. */
      .barra {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: #0b1020;
        border: 1px solid #3a4a7a;
        overflow: hidden;
      }
      /* Relleno de la barra; su ancho lo fija la escena segun el valor. */
      .barra-relleno {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4f6bff, #7f93ff);
        transition: width 0.4s ease;
      }

      /* Habilidades como etiquetas tipo "chip". */
      #tarjeta-habilidades {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .habilidad-etiqueta {
        display: inline-block;
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 999px;
        background: #2a335a;
        border: 1px solid #4f6bff;
        color: #e8eefc;
      }

      /* Botones de accion de la tarjeta. */
      #tarjeta-acciones {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      #tarjeta-acciones button {
        flex: 1 1 160px;
        min-height: 44px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      #boton-crear-otro {
        background: #2a335a;
        color: #e8eefc;
        border: 1px solid #4f6bff;
      }
      #boton-crear-otro:hover {
        background: #333e6e;
      }
      #boton-ir-arena {
        background: #4f6bff;
        color: #ffffff;
      }
      #boton-ir-arena:hover {
        background: #3a56ee;
      }

      /* -----------------------------------------------------------------
         Overlay HTML del Salón de las Leyendas (ranking).
         Como el overlay de invocacion, va superpuesto al canvas de Phaser
         (position:absolute, z-index superior). Al ser HTML + CSS garantiza:
           - texto minimo de 16px en movil (Requisito 18.1),
           - una sola columna en anchos < 768px y controles tactiles grandes
             (Requisito 1.2),
           - varias columnas en anchos >= 768px (Requisito 1.3),
           - re-adaptacion al cambiar el ancho sin recargar, via media queries
             (Requisito 1.5),
           - sin scroll horizontal entre 320px y 1920px: el overlay nunca
             supera el ancho visible y el texto largo se parte (Requisitos 1.6,
             1.7, 18.3). El scroll vertical interno se permite si hay muchas
             entradas, pero nunca horizontal.
         ----------------------------------------------------------------- */
      #overlay-ranking {
        position: absolute;
        z-index: 10; /* por encima del canvas de Phaser */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        /* Ocupa casi todo el ancho en movil y se limita en pantallas grandes;
           min(...) evita desbordes a 320px (Requisito 1.6). */
        width: min(94%, 920px);
        max-height: 92%;
        display: none; /* oculto por defecto; RankingScene lo muestra */
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        overflow-y: auto; /* scroll vertical si hay muchas entradas, nunca horizontal */
        overflow-x: hidden;
      }
      /* Clase que RankingScene usa para mostrar el overlay. */
      #overlay-ranking.visible {
        display: flex;
      }

      #titulo-ranking {
        margin: 0;
        /* Tamano fluido: visible y completo sin recortes en cualquier ancho
           (Requisitos 1.4, 1.7). */
        font-size: clamp(22px, 6vw, 40px);
        text-align: center;
        line-height: 1.2;
        word-break: break-word;
      }

      /* Mensajes de estado (carga / error / vacio) en espanol. */
      #mensaje-ranking {
        min-height: 20px;
        font-size: 16px; /* minimo 16px en movil (Requisito 18.1) */
        text-align: center;
        color: #9fb0d8;
      }
      #mensaje-ranking.error {
        color: #ff7a7a;
      }

      /* Rejilla del ranking. Por defecto (movil, < 768px) una sola columna
         (Requisito 1.2). En pantallas grandes pasa a varias columnas mediante
         media query (Requisito 1.3). */
      #lista-ranking {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr; /* una sola columna en movil */
        gap: 10px;
      }
      /* Cada entrada del ranking: puesto, colores, nombre y victorias. */
      .entrada-ranking {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        min-height: 44px; /* area tactil comoda en movil (Requisito 18.2) */
        border-radius: 10px;
        background: #141a33;
        border: 1px solid #3a4a7a;
      }
      /* Puesto en el ranking (1, 2, 3, ...). */
      .entrada-puesto {
        flex: 0 0 auto;
        min-width: 32px;
        font-size: 18px;
        font-weight: 700;
        color: #9fb0d8;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      /* Circulo dividido en dos mitades con los colores del campeon. */
      .entrada-colores {
        flex: 0 0 auto;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid #0b1020;
        box-shadow: 0 0 0 1px #3a4a7a;
      }
      /* Nombre del campeon: ocupa el espacio disponible y se parte si es largo
         para no generar scroll horizontal (Requisitos 1.6, 1.7). */
      .entrada-nombre {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 16px; /* minimo 16px en movil (Requisito 18.1) */
        font-weight: 600;
        color: #e8eefc;
        word-break: break-word;
      }
      /* Numero de victorias, alineado a la derecha. */
      .entrada-victorias {
        flex: 0 0 auto;
        font-size: 16px; /* minimo 16px en movil (Requisito 18.1) */
        color: #ffd15a;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* Boton "Volver a jugar": area tactil minima de 44x44px en movil
         (Requisito 18.2). */
      #boton-volver-jugar {
        align-self: center;
        min-height: 44px;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: #4f6bff;
        color: #ffffff;
        cursor: pointer;
      }
      #boton-volver-jugar:hover {
        background: #3a56ee;
      }

      /* -----------------------------------------------------------------
         Overlay HTML de la pantalla de seleccion de campeones.
         Igual que los overlays de invocacion y ranking, las tarjetas, la pista
         y el boton NO son objetos de Phaser: son elementos HTML superpuestos al
         canvas (position:absolute, z-index superior). Al ser HTML + CSS la
         rejilla es verdaderamente responsiva (una sola columna < 768px, varias
         columnas >= 768px via auto-fit) y el texto puede garantizar el minimo de
         16px en movil sin verse borroso por el escalado del canvas. La version
         movil es prioritaria porque el publico juega desde el celular. */
      #overlay-seleccion {
        position: absolute;
        z-index: 10; /* por encima del canvas de Phaser */
        top: 0;
        left: 0;
        /* Ocupa todo el contenedor del juego para poder fijar el boton abajo. */
        width: 100%;
        height: 100%;
        display: none; /* oculto por defecto; SeleccionScene lo muestra */
        flex-direction: column;
        padding: 16px;
        overflow-y: auto; /* scroll vertical si hay muchas tarjetas, nunca horizontal */
        overflow-x: hidden;
      }
      /* Clase que SeleccionScene usa para mostrar el overlay. */
      #overlay-seleccion.visible {
        display: flex;
      }

      #titulo-seleccion {
        margin: 0 0 4px;
        font-size: clamp(22px, 6vw, 40px);
        text-align: center;
        line-height: 1.2;
        word-break: break-word;
      }

      /* Pista dinamica que indica cuantos campeones faltan por seleccionar. */
      #pista-seleccion {
        min-height: 20px;
        margin: 0 0 8px;
        font-size: 16px; /* minimo 16px en movil (Requisito 18.1) */
        text-align: center;
        color: #9fb0d8;
      }

      /* Mensaje de estado (carga / vacio / error) en espanol. */
      #mensaje-seleccion {
        min-height: 20px;
        font-size: 16px;
        text-align: center;
        color: #9fb0d8;
      }
      #mensaje-seleccion.error {
        color: #ff7a7a;
      }

      /* Rejilla de campeones: una sola columna en movil (< 768px). En pantallas
         grandes pasa a varias columnas con auto-fit y minmax(260px, 1fr). El
         contenedor se centra con max-width 1100px y margin auto. El padding
         inferior reserva espacio para el boton fijo de "Iniciar combate". */
      #lista-seleccion {
        list-style: none;
        margin: 0 auto;
        padding: 0 0 96px;
        width: 100%;
        max-width: 1100px;
        display: grid;
        grid-template-columns: 1fr; /* una sola columna en movil */
        gap: 16px;
      }

      /* Tarjeta de un campeon: nombre, circulo de colores, estadisticas con
         barras y habilidades como etiquetas. Interactiva (cursor y resaltado). */
      .tarjeta-seleccion {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        border-radius: 12px;
        background: #141a33;
        border: 2px solid #3a4a7a;
        cursor: pointer;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .tarjeta-seleccion:hover {
        border-color: #4f6bff;
      }
      /* Tarjeta seleccionada: borde destacado y un halo azul. */
      .tarjeta-seleccion.seleccionada {
        border-color: #4f6bff;
        box-shadow: 0 0 0 2px #4f6bff inset, 0 0 12px rgba(79, 107, 255, 0.5);
      }

      .seleccion-cabecera {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .seleccion-nombre {
        margin: 0;
        font-size: clamp(18px, 4.5vw, 24px);
        line-height: 1.2;
        word-break: break-word;
      }
      /* Circulo dividido en dos mitades con los colores del campeon. */
      .seleccion-colores {
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #0b1020;
        box-shadow: 0 0 0 1px #3a4a7a;
      }

      /* Bloque de estadisticas con barras (reutiliza el look de la tarjeta de
         invocacion). */
      .seleccion-estadisticas {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Habilidades como etiquetas tipo "chip" (mismo estilo que invocacion). */
      .seleccion-habilidades {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* Barra inferior fija con el boton "Iniciar combate": en movil queda
         pegada abajo para que siempre se vea sin tener que desplazarse. El
         degradado evita que las tarjetas que pasan por detras se corten en seco. */
      #barra-seleccion {
        position: sticky;
        bottom: 0;
        left: 0;
        margin-top: auto;
        padding: 12px 0 4px;
        display: flex;
        justify-content: center;
        background: linear-gradient(to top, #0b1020 70%, rgba(11, 16, 32, 0));
      }
      #boton-iniciar-combate {
        width: min(100%, 360px);
        min-height: 48px;
        padding: 12px 24px;
        font-size: 18px;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        background: #4f6bff;
        color: #ffffff;
        cursor: pointer;
      }
      #boton-iniciar-combate:hover {
        background: #3a56ee;
      }
      #boton-iniciar-combate:disabled {
        background: #2a335a;
        color: #9fb0d8;
        cursor: not-allowed;
      }

      /* En pantallas grandes (>= 768px) el overlay puede ensancharse un poco
         mas; la responsividad detallada vive en las escenas (tarea 8.5). */
      @media (min-width: 768px) {
        #overlay-invocacion {
          width: min(70%, 560px);
        }
        /* Varias columnas en el ranking (Requisito 1.3): el ancho minimo de
           columna reparte automaticamente 2-3 columnas segun el ancho. */
        #lista-ranking {
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }
        /* Varias columnas en la seleccion de campeones (Requisito 1.3): auto-fit
           + minmax(260px, 1fr) reparte 2-4 columnas segun el ancho disponible. */
        #lista-seleccion {
          grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <!-- Contenedor donde Phaser monta el canvas del juego. -->
    <div id="contenedor-juego">
      <!-- Overlay HTML de la pantalla de invocacion (controlado por InvocacionScene). -->
      <div id="overlay-invocacion">
        <!-- Formulario de invocacion. InvocacionScene lo oculta al mostrar la
             tarjeta del campeon creado y lo vuelve a mostrar con "Crear otro". -->
        <div id="formulario-invocacion">
          <h1 id="titulo-invocacion">Invoca tu leyenda</h1>
          <textarea
            id="descripcion-campeon"
            minlength="10"
            maxlength="500"
            placeholder="Describe tu campeon (entre 10 y 500 caracteres)..."
            aria-label="Descripcion del campeon"
          ></textarea>
          <div id="contador-caracteres">0 / 500</div>
          <button id="boton-invocar" type="button">Invocar</button>
          <!-- Acceso directo a la arena usando campeones ya existentes, sin
               crear uno nuevo. Usa el mismo estilo secundario que el boton
               "Crear otro campeón" de la tarjeta. -->
          <button id="boton-ir-arena-existentes" type="button">
            Ir a la arena con campeones existentes
          </button>
          <div id="mensaje-invocacion"></div>
        </div>

        <!-- Tarjeta del campeon recien creado. Oculta hasta que un POST
             /campeones exitoso la rellene (nombre, estadisticas con barras,
             habilidades como etiquetas y circulo de colores). -->
        <div id="tarjeta-campeon" aria-live="polite">
          <div class="tarjeta-cabecera">
            <h2 id="tarjeta-nombre"></h2>
            <div
              id="tarjeta-colores"
              role="img"
              aria-label="Colores del campeon"
            ></div>
          </div>
          <div id="tarjeta-estadisticas"></div>
          <div id="tarjeta-habilidades"></div>
          <div id="tarjeta-acciones">
            <button id="boton-crear-otro" type="button">Crear otro campeón</button>
            <button id="boton-ir-arena" type="button">Ir a la arena</button>
          </div>
        </div>
      </div>

      <!-- Overlay HTML del Salón de las Leyendas (controlado por RankingScene).
           Igual que el overlay de invocación, el listado del ranking y el boton
           "Volver a jugar" son elementos HTML superpuestos al canvas: asi el
           texto puede garantizar un minimo real de 16px en movil y la rejilla
           puede re-adaptarse (1 columna < 768px, varias >= 768px) con media
           queries de CSS, sin recargar la pagina (Requisitos 1.2, 1.3, 1.5,
           18.1). -->
      <div id="overlay-ranking" aria-live="polite">
        <h1 id="titulo-ranking">Salón de las Leyendas</h1>
        <!-- Mensaje de estado (carga / error / vacio) en espanol. -->
        <div id="mensaje-ranking"></div>
        <!-- Rejilla del ranking: una sola columna en movil y varias columnas en
             pantallas grandes (las columnas las fija el CSS responsivo). -->
        <ol id="lista-ranking"></ol>
        <!-- Boton para volver a la pantalla de invocacion y jugar de nuevo. -->
        <button id="boton-volver-jugar" type="button">Volver a jugar</button>
      </div>

      <!-- Overlay HTML de la seleccion de campeones (controlado por SeleccionScene).
           Como los overlays de invocacion y ranking, las tarjetas, la pista y el
           boton son elementos HTML superpuestos al canvas: asi la rejilla es
           responsiva (1 columna < 768px, varias >= 768px) y el texto nunca se ve
           borroso por el escalado del canvas. El boton "Iniciar combate" queda
           fijo abajo en movil. SeleccionScene muestra y oculta este overlay. -->
      <div id="overlay-seleccion" aria-live="polite">
        <h1 id="titulo-seleccion">Elige dos campeones</h1>
        <!-- Pista dinamica: cuantos campeones faltan por seleccionar. -->
        <div id="pista-seleccion"></div>
        <!-- Mensaje de estado (carga / vacio / error) en espanol. -->
        <div id="mensaje-seleccion"></div>
        <!-- Rejilla de tarjetas de campeones (las columnas las fija el CSS). -->
        <ul id="lista-seleccion"></ul>
        <!-- Barra inferior fija con el boton para iniciar el combate. -->
        <div id="barra-seleccion">
          <button id="boton-iniciar-combate" type="button" disabled>
            Iniciar combate
          </button>
        </div>
      </div>
    </div>

    <!-- Configuracion generada en despliegue (gitignored). Define window.CONFIG.apiUrl.
         Si no existe (desarrollo local), main.js usa http://localhost:3000 por defecto.
         El atributo onerror evita que un 404 rompa la carga en local. -->
    <script src="config.js" onerror="window.__sinConfig = true"></script>

    <!-- Phaser 3 desde CDN: apropiado y simple para un sitio estatico en S3/CloudFront. -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

    <!-- Punto de entrada del juego como modulo ES (permite importar combat.js y las escenas). -->
    <script type="module" src="src/main.js"></script>
  </body>
</html>
